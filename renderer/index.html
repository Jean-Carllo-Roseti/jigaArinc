<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arinc Jiga</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
          <div class="top-bar">
            <select id="port-select">
              <option>Carregando...</option>
            </select>
            <button id="connect-btn">Connect</button>
          </div>
    
          <h2>📥 Mensagens Recebidas</h2>
          <table id="received-table">
            <thead>
              <tr class="cabecalho">
                <th class="label">Label</th>
                <th class="parity">Parity</th>
                <th class="SSM">SSM</th>
                <th class="data">Data</th>
                <th class="SDI">SDI</th>
                <th class="hex">Hexa</th>
                <th class="decimal">Decimal</th>
              </tr>
            </thead>
            <tbody id="data-table-body">
            </tbody>
          </table>
          <h2>📤 Enviar Mensagens ARINC</h2>
          <table id="send-table">
            <thead>
              <tr class="cabecalho">
                <th class="label">Label</th>
                <th class="parity">Parity</th>
                <th class="SSM">SSM</th>
                <th class="data">Data</th>
                <th class="SDI">SDI</th>
                <th class="hex">Hexa</th>
                <th class="decimal">Decimal</th>
              </tr>
            </thead>

              <tr><td>134</td><td><input type="number"  /></td><td><input type="number"  /><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td></tr>
              <tr><td>203</td><td><input type="number"  /></td><td><input type="number"  /><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td></tr>
              <tr><td>213</td><td><input type="number"  /></td><td><input type="number"  /><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td></tr>
              <tr><td>333</td><td><input type="number"  /></td><td><input type="number"  /><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number"  /></td><td><input type="number" /></td></tr>
            </tbody> -->
             <tbody>
                <tr>
                  <td> <!-- Label octa -->
                    <input type="number" class="bit-input" placeholder="134"
                      oninput="this.value = this.value.slice(0,3)">
                  </td>
                        
                  <td> <!-- Parity  -->
                    <input type="number" class="bit-input" 
                    oninput="this.value = this.value.slice(0, 1);"></td>
                 
                  <td>  <!-- SSM (2 bits) -->
                    <input type="number"  class="bit-input" 
                    oninput="this.value = this.value.slice(0,2);">
                  </td>
                  
                  <td> <!-- Data (19 bits) -->
                    <input type="number" class="bit-input"
                     oninput="this.value = this.value.slice(0,19)">
                  </td>
                 
                  <td>  <!-- SDI (2 bits) -->
                    <input type="number"  class="bit-input"
                      oninput="this.value = this.value.slice(0,2);">
                  </td>
                  
                  <td> <!-- HEXA (8 bits) -->
                    <input type="number" class="bit-input" 
                      oninput="this.value = this.value.slice(0,8)">
                  </td>
                  <td>  <!-- Decimal = data -->
                    <input type="number" class="bit-input" 
                      oninput="this.value = this.value.slice(0,3)">
                  </td>
                </tr>
                <tr>
                  <td>
                    <input type="number" class="bit-input" placeholder="203"
                      oninput="this.value = this.value.slice(0,3)">

                  <td><input type="number" class="bit-input"

                  <!-- SSM (2 bits) -->
                  <td>

                  </td>
                  <!-- Data (19 bits) -->
                  <td>

                  <td>

                  <td>
                    <input type="number" class="bit-input" 
                      oninput="this.value = this.value.slice(0,8)">
                  </td>
                  <td>
                    <input type="number" class="bit-input" 
                      oninput="this.value = this.value.slice(0,3)">
                  </td>
                </tr>
                <tr>

                  <!-- SSM (2 bits) -->
                  <td>

                  <!-- Data (19 bits) -->
                  <td>
                    <input type="number" class="bit-input"
                     oninput="this.value = this.value.slice(0,19)">
                  </td>
                  <!-- SDI (2 bits) -->
                  <td>
                    <input type="number"  class="bit-input"
                      oninput="this.value = this.value.slice(0,2);">
                  </td>
                  <!-- Label (8 bits) -->
                  <td>
                    <input type="number" class="bit-input" 
                      oninput="this.value = this.value.slice(0,8)">
                  </td>
                  <td>
                    <input type="number" class="bit-input" 
                      oninput="this.value = this.value.slice(0,3)">
                  </td>
                </tr>
                <tr>
                  <td>
                    <input type="number" class="bit-input" placeholder="333"
                      oninput="this.value = this.value.slice(0,3)">
                  </td>
                  <!-- Parity (1 bit) -->
                  <td><input type="number" class="bit-input" 
                    oninput="this.value = this.value.slice(0, 1);"></td>
                  <!-- SSM (2 bits) -->
                  <td>
                    <input type="number"  class="bit-input" 
                    oninput="this.value = this.value.slice(0,2);">
                  </td>
                  <!-- Data (19 bits) -->
                  <td>
                    <input type="number" class="bit-input"
                     oninput="this.value = this.value.slice(0,19)">
                  </td>
                  <!-- SDI (2 bits) -->
                  <td>
                    <input type="number"  class="bit-input"
                      oninput="this.value = this.value.slice(0,2);">

                  <td>
                    <input type="number" class="bit-input"

                </tr>
              </tbody>
          </table>
          <button class="send-btn" id="send-btn">Enviar</button>
        </div>
    
        <div class="sidebar" id="sidebar">
